# Configuration for `cargo release`, see https://github.com/crate-ci/cargo-release

# Turns the changelog's Unreleased section into this version's section. The release workflow
# (.github/workflows/release.yml) then publishes that section as the GitHub release notes.
pre-release-replacements = [
    { file = "CHANGELOG.md", search = "## \\[Unreleased\\]", replace = "## [Unreleased]\n\n## [{{version}}] - {{date}}", exactly = 1 },
]
